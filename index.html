<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MorsAra | پنل مدیریت سفارش‌ها</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --panel:#151517; --panel-2:#1b1b1e; --border:#2b2b2f;
    --text:#f1ede4; --text-soft:#a6a29a; --gold:#d8b56a; --gold-2:#b6893f;
    --green:#3fbf6a; --maroon:#c0463f; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image: radial-gradient(circle at 15% 0%, rgba(216,181,106,.06), transparent 40%),
                       radial-gradient(circle at 85% 20%, rgba(216,181,106,.05), transparent 45%);
    font-family:'Vazirmatn', sans-serif; color:var(--text); min-height:100vh;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:26px 18px 80px; }

  /* Login */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-box{
    width:100%; max-width:360px; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:32px 28px; text-align:center;
  }
  .login-box .brand{ font-weight:800; letter-spacing:.2em; color:var(--gold); font-size:1.3rem; margin-bottom:4px; direction:ltr; }
  .login-box .sub{ color:var(--text-soft); font-size:.8rem; margin-bottom:24px; }
  .login-box input{
    width:100%; border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:12px 14px; border-radius:8px; font-family:'Vazirmatn'; font-size:.92rem; outline:none; margin-bottom:12px;
  }
  .login-box input:focus{ border-color:var(--gold); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer;
    font-family:'Vazirmatn'; font-weight:700; font-size:.86rem; padding:12px 24px; width:100%;
    border-radius:8px; background:linear-gradient(135deg, var(--gold), var(--gold-2)); color:#20160a; transition:.2s;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(216,181,106,.25); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.ghost{ background:transparent; color:var(--text-soft); border:1.5px solid var(--border); margin-top:10px; }
  .login-error{ color:var(--maroon); font-size:.78rem; margin-top:10px; display:none; text-align:center; }

  /* Header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:24px; padding-bottom:18px; border-bottom:1px solid var(--border);
  }
  .topbar h1{ font-size:1.05rem; color:var(--gold); margin:0; font-weight:700; }
  .topbar .who{ font-size:.76rem; color:var(--text-soft); }
  .logout-btn{
    background:transparent; border:1.5px solid var(--border); color:var(--text-soft);
    padding:8px 16px; border-radius:8px; font-family:'Vazirmatn'; font-size:.78rem; cursor:pointer; transition:.2s;
  }
  .logout-btn:hover{ border-color:var(--maroon); color:var(--maroon); }

  /* Stats */
  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .stat-card .num{ font-size:1.4rem; font-weight:800; color:var(--gold); }
  .stat-card .lbl{ font-size:.75rem; color:var(--text-soft); margin-top:2px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .toolbar input[type=text]{
    flex:1; min-width:180px; border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:10px 14px; border-radius:8px; font-family:'Vazirmatn'; font-size:.85rem; outline:none;
  }
  .toolbar input:focus{ border-color:var(--gold); }
  .refresh-btn{
    background:var(--panel-2); border:1px solid var(--border); color:var(--gold);
    padding:10px 16px; border-radius:8px; font-family:'Vazirmatn'; font-size:.8rem; cursor:pointer; transition:.2s; white-space:nowrap;
  }
  .refresh-btn:hover{ border-color:var(--gold-2); }

  /* Orders list */
  .order-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    margin-bottom:10px; overflow:hidden; transition:.15s;
  }
  .order-card:hover{ border-color:var(--gold-2); }
  .order-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 18px; cursor:pointer; flex-wrap:wrap;
  }
  .order-row .main-info{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .order-row .name{ font-weight:700; font-size:.95rem; color:var(--text); }
  .order-row .phone{ font-size:.82rem; color:var(--gold); direction:ltr; }
  .order-row .date{ font-size:.72rem; color:var(--text-soft); }
  .status-badge{
    font-size:.68rem; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap;
  }
  .status-badge.new{ background:rgba(216,181,106,.15); color:var(--gold); border:1px solid var(--gold-2); }
  .status-badge.done{ background:rgba(63,191,106,.12); color:var(--green); border:1px solid var(--green); }
  .chev{ color:var(--text-soft); font-size:.8rem; transition:.2s; }
  .order-card.open .chev{ transform:rotate(180deg); }

  .order-details{ display:none; padding:0 18px 18px; border-top:1px solid var(--border); }
  .order-card.open .order-details{ display:block; }
  .detail-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:10px; margin-top:14px; }
  .detail-item{ background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .detail-item .k{ font-size:.7rem; color:var(--text-soft); margin-bottom:4px; }
  .detail-item .v{ font-size:.86rem; color:var(--text); font-weight:600; }
  .detail-item .v.morse{ direction:ltr; text-align:left; font-family:monospace; letter-spacing:2px; color:var(--gold); }
  .detail-notes{ margin-top:10px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:.84rem; color:var(--text-soft); line-height:1.9; }
  .detail-actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .detail-actions button, .detail-actions a{
    flex:1; min-width:140px; text-align:center; padding:9px 14px; border-radius:8px; font-family:'Vazirmatn';
    font-size:.78rem; font-weight:700; cursor:pointer; border:none; text-decoration:none;
  }
  .mark-done-btn{ background:linear-gradient(135deg,#3fbf6a,#279050); color:#fff; }
  .wa-open-btn{ background:transparent; border:1.5px solid var(--border); color:var(--text); }
  .wa-open-btn:hover{ border-color:var(--gold); color:var(--gold); }

  .empty-state, .loading-state{ text-align:center; color:var(--text-soft); font-size:.85rem; padding:40px 0; }
</style>
</head>
<body>

<!-- در حال اتصال -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="brand">MORSARA</div>
    <div class="sub" id="connectStatus">در حال اتصال به فایربیس…</div>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="wrap" id="adminScreen" style="display:none;">
  <div class="topbar">
    <h1>پنل مدیریت سفارش‌ها</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="who" id="whoLabel">متصل به فایربیس</span>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">کل سفارش‌ها</div></div>
    <div class="stat-card"><div class="num" id="statNew">0</div><div class="lbl">سفارش جدید</div></div>
    <div class="stat-card"><div class="num" id="statDone">0</div><div class="lbl">انجام‌شده</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="جستجو بر اساس اسم یا شماره تماس…">
    <button type="button" class="refresh-btn" id="refreshBtn">به‌روزرسانی</button>
  </div>

  <div id="ordersList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" crossorigin="anonymous"></script>
<!--
  همان فایل تنظیمات فایربیسِ سایت اصلی را اینجا هم لود می‌کنیم تا
  auth و db از قبل تعریف‌شده باشند و پروژه‌ی یکسانی استفاده شود.
-->
<script src="firebase-config.js" onerror="console.warn('[MorsAra-Admin] firebase-config.js لود نشد.')"></script>
<script>
'use strict';

document.addEventListener('DOMContentLoaded', function () {

  var loginScreen = document.getElementById('loginScreen');
  var adminScreen = document.getElementById('adminScreen');
  var loginError = document.getElementById('loginError');
  var ordersList = document.getElementById('ordersList');
  var whoLabel = document.getElementById('whoLabel');

  var allOrders = [];
  var unsubscribeOrders = null;

  if(typeof auth === 'undefined' || typeof db === 'undefined'){
    loginError.textContent = 'فایل تنظیمات فایربیس (firebase-config.js) پیدا نشد یا auth/db را تعریف نکرده است.';
    loginError.style.display = 'block';
    return;
  }

  function fmtDate(ts){
    if(!ts) return '—';
    var d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('fa-IR') + ' - ' + d.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
  }
  function fmtPrice(n){ return (n || 0).toLocaleString('fa-IR') + ' تومان'; }
  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  /* ---- اتصال خودکار (بدون فرم ورود) ---- */
  auth.onAuthStateChanged(function (user) {
    if(user){
      loginScreen.style.display = 'none';
      adminScreen.style.display = 'block';
      startListening();
    }
  });

  auth.signInAnonymously().catch(function (err) {
    console.error('[MorsAra-Admin] خطای اتصال:', err);
    document.getElementById('connectStatus').textContent = 'اتصال به فایربیس ناموفق بود.';
    loginError.textContent = 'خطا: ' + (err && err.message ? err.message : 'نامشخص') + ' — کنسول مرورگر (F12) را برای جزئیات بیشتر ببینید.';
    loginError.style.display = 'block';
  });

  /* ---- گوش‌دادن زنده به سفارش‌ها ---- */
  function startListening(){
    ordersList.innerHTML = '<div class="loading-state">در حال بارگذاری سفارش‌ها…</div>';
    if(unsubscribeOrders) unsubscribeOrders();
    unsubscribeOrders = db.collection('orders').orderBy('createdAt', 'desc')
      .onSnapshot(function (snapshot) {
        allOrders = snapshot.docs.map(function (doc) {
          var data = doc.data();
          data._id = doc.id;
          return data;
        });
        renderOrders();
      }, function (err) {
        console.error('[MorsAra-Admin] خطای دریافت سفارش‌ها:', err);
        ordersList.innerHTML = '<div class="empty-state">خطا در دریافت سفارش‌ها. احتمالاً قوانین امنیتی فایربیس (Firestore Rules) اجازه‌ی خواندن به این حساب را نداده‌اند.</div>';
      });
  }

  document.getElementById('refreshBtn').addEventListener('click', startListening);
  document.getElementById('searchInput').addEventListener('input', renderOrders);

  /* ---- رندر لیست سفارش‌ها ---- */
  function renderOrders(){
    var query = document.getElementById('searchInput').value.trim().toLowerCase();
    var filtered = allOrders.filter(function (o) {
      if(!query) return true;
      return (o.name || '').toLowerCase().indexOf(query) !== -1 ||
             (o.phone || '').indexOf(query) !== -1;
    });

    document.getElementById('statTotal').textContent = allOrders.length;
    document.getElementById('statNew').textContent = allOrders.filter(function (o) { return o.status !== 'انجام‌شده'; }).length;
    document.getElementById('statDone').textContent = allOrders.filter(function (o) { return o.status === 'انجام‌شده'; }).length;

    if(!filtered.length){
      ordersList.innerHTML = '<div class="empty-state">سفارشی یافت نشد.</div>';
      return;
    }

    ordersList.innerHTML = filtered.map(function (o, idx) {
      var isDone = o.status === 'انجام‌شده';
      var waText = encodeURIComponent(
        'سلام ' + (o.name || '') + '، سفارش شما (' + (o.morseCode || '') + ') در حال آماده‌سازی است.'
      );
      return (
        '<div class="order-card" data-idx="' + idx + '">' +
          '<div class="order-row" data-toggle="' + idx + '">' +
            '<div class="main-info">' +
              '<span class="name">' + escapeHtml(o.name || 'بدون‌نام') + '</span>' +
              '<span class="phone">' + escapeHtml(o.phone || '—') + '</span>' +
              '<span class="date">' + fmtDate(o.createdAt) + '</span>' +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:10px;">' +
              '<span class="status-badge ' + (isDone ? 'done' : 'new') + '">' + (isDone ? 'انجام‌شده' : 'جدید') + '</span>' +
              '<span class="chev">▾</span>' +
            '</div>' +
          '</div>' +
          '<div class="order-details">' +
            '<div class="detail-grid">' +
              '<div class="detail-item"><div class="k">کد مورس</div><div class="v morse">' + escapeHtml(o.morseCode || '—') + '</div></div>' +
              '<div class="detail-item"><div class="k">نوع محصول</div><div class="v">' + escapeHtml(o.productType || '—') + '</div></div>' +
              '<div class="detail-item"><div class="k">نوع بند</div><div class="v">' + escapeHtml(o.cordType || '—') + '</div></div>' +
              '<div class="detail-item"><div class="k">رنگ مهره‌ها</div><div class="v">' + escapeHtml((o.colors || []).join('، ')) + '</div></div>' +
              '<div class="detail-item"><div class="k">تعداد مهره قلبی</div><div class="v">' + (o.heartCount || 0) + '</div></div>' +
              '<div class="detail-item"><div class="k">تعداد خط / نقطه</div><div class="v">' + (o.dashCount || 0) + ' خط، ' + (o.dotCount || 0) + ' نقطه</div></div>' +
              '<div class="detail-item"><div class="k">قیمت پایه</div><div class="v">' + fmtPrice(o.basePrice) + '</div></div>' +
              '<div class="detail-item"><div class="k">قیمت نهایی</div><div class="v" style="color:var(--gold); font-size:1rem;">' + fmtPrice(o.totalPrice) + '</div></div>' +
            '</div>' +
            (o.notes ? '<div class="detail-notes"><b>توضیحات:</b> ' + escapeHtml(o.notes) + '</div>' : '') +
            '<div class="detail-actions">' +
              '<a class="wa-open-btn" href="https://wa.me/' + escapeHtml((o.phone || '').replace(/^0/, '98')) + '?text=' + waText + '" target="_blank" rel="noopener noreferrer">پیام در واتساپ به مشتری</a>' +
              (isDone
                ? '<button type="button" class="mark-done-btn" data-undo="' + escapeHtml(o._id) + '" style="background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#20160a;">برگرداندن به «جدید»</button>'
                : '<button type="button" class="mark-done-btn" data-done="' + escapeHtml(o._id) + '">علامت‌گذاری به‌عنوان انجام‌شده</button>') +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    /* باز/بسته کردن جزئیات */
    ordersList.querySelectorAll('[data-toggle]').forEach(function (row) {
      row.addEventListener('click', function () {
        row.closest('.order-card').classList.toggle('open');
      });
    });

    /* علامت‌گذاری وضعیت */
    ordersList.querySelectorAll('[data-done]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        db.collection('orders').doc(btn.dataset.done).update({ status: 'انجام‌شده' })
          .catch(function (err) { console.error('[MorsAra-Admin] خطای به‌روزرسانی وضعیت:', err); });
      });
    });
    ordersList.querySelectorAll('[data-undo]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        db.collection('orders').doc(btn.dataset.undo).update({ status: 'جدید' })
          .catch(function (err) { console.error('[MorsAra-Admin] خطای به‌روزرسانی وضعیت:', err); });
      });
    });
  }

});
</script>
</body>
</html>
